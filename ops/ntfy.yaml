# S92 — self-hosted ntfy for Ghost app push (UnifiedPush). Tailnet-only (ClusterIP + tailscale
# serve on :10443), access-controlled (deny-all default; a token grants rw on Lea's private topic).
# Auth/cache DBs persist on a hostPath so the token survives pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ghost
spec:
  replicas: 1
  selector:
    matchLabels: { app: ntfy }
  template:
    metadata:
      labels: { app: ntfy }
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            - { name: NTFY_BASE_URL,            value: "https://hivequeen.TSNET.ts.net:10443" }
            - { name: NTFY_LISTEN_HTTP,         value: ":80" }
            - { name: NTFY_BEHIND_PROXY,        value: "true" }
            - { name: NTFY_AUTH_FILE,           value: "/var/lib/ntfy/user.db" }
            - { name: NTFY_AUTH_DEFAULT_ACCESS, value: "deny-all" }
            - { name: NTFY_CACHE_FILE,          value: "/var/lib/ntfy/cache.db" }
            - { name: NTFY_CACHE_DURATION,      value: "72h" }
          ports:
            - containerPort: 80
          volumeMounts:
            - { name: data, mountPath: /var/lib/ntfy }
      volumes:
        - name: data
          hostPath:
            path: /home/USER/ntfy-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ghost
spec:
  type: ClusterIP
  selector: { app: ntfy }
  ports:
    - port: 80
      targetPort: 80
