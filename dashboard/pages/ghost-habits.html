<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost — Habits &amp; Todos</title>
<!-- Ghost 2.0 Phase 1 (native Habits & Todos). Built to the "Habits & Todos"
     artboard on the Ghost 2.0 Screens canvas, in the confirmed gothic-monochrome design
     system. Served live from the vault; data comes from the native.py-backed /api/habits,
     /api/todos (same code path the Telegram bot uses). Styling reuses the shared
     tokens/base/grain/watermark from ghost-common.css; component styles below are lifted from
     the artboards. -->
<link rel="stylesheet" href="/assets/ghost-common.css?v=61">
<!-- S83: PWA — installable as a home-screen app (this page only). Manifest + theme colour +
     home-screen icon. Service worker registered at the bottom of <body>. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#150e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Habits">
<link rel="apple-touch-icon" href="/assets/ghost-icon-192.png">
<style>
  :root{
    --ink:#e6dde2; --ink-dim:#a8949e; --ink-faint:#8a7784; --ink-faintest:#5c5058;
    --accent:#eab8c0; --accent-soft:rgba(234,184,192,0.13);
    --ok:#8fc9a3; --warn:#d9b872; --alert:#d97a8c;
    --border:rgba(255,255,255,0.10); --border-2:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  a{color:inherit;text-decoration:none;}

  /* topbar — shared shell language */
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;}
  .backlink{display:flex;align-items:center;gap:8px;padding:7px 13px;font-size:11px;color:var(--ink-dim);}
  .backlink:hover{color:var(--ink);}
  .brand{display:flex;align-items:center;gap:8px;margin-left:4px;}
  .brand-mark{width:20px;height:20px;flex-shrink:0;}
  .brand-text b{font-size:12.5px;letter-spacing:0.1em;color:var(--accent);}
  .brand-text span{display:block;font-size:7.5px;letter-spacing:0.12em;color:var(--ink-faint);}
  .topbar .spacer{flex:1 1 auto;}
  .nav-pill{display:flex;gap:4px;padding:3px;}
  .nav-pill a, .nav-pill button{
    padding:6px 12px;font-size:10.5px;border-radius:5px;color:var(--ink-faint);
    background:transparent;border:none;cursor:pointer;font-family:inherit;
  }
  .nav-pill a.active, .nav-pill button.active{background:rgba(255,255,255,0.08);color:var(--ink);}

  .wrap{max-width:760px;margin:0 auto;padding:6px 20px 20px;display:flex;flex-direction:column;gap:14px;}

  .panel{background:var(--gc-panel-bg);border:1px solid var(--border);border-radius:5px;}
  .section{padding:14px 15px 10px 15px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card-title{font-family:var(--gc-serif);text-transform:uppercase;font-variant:small-caps;letter-spacing:0.07em;color:var(--ink-dim);font-size:11px;font-weight:700;}
  .section-sub{font-size:10px;color:var(--ink-faint);}
  .add-btn{font-family:var(--gc-serif);font-variant:small-caps;letter-spacing:0.05em;font-size:10.5px;color:var(--ink-dim);background:transparent;border:1px solid var(--border);border-radius:5px;padding:3px 10px;cursor:pointer;}
  .add-btn:hover{color:var(--ink);border-color:rgba(255,255,255,0.25);}

  /* habit / todo rows */
  .todo-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-2);}
  /* S77: habit row is a FIXED-TRACK grid so the streak pill forms a straight column regardless of
     which tap-control (tickbox / single / dual / none-for-checklist) precedes it. Tracks:
     icon | name(flex) | tap-controls(fixed) | streak(fixed) | archive. */
  .habit-row{display:grid;grid-template-columns:28px minmax(0,1fr) 62px 54px 24px 24px;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-2);}
  .habit-row .tap-btns{justify-content:flex-end;}   /* buttons hug the streak column within their fixed track */
  .habit-row:last-child,.todo-row:last-child{border-bottom:none;}
  .row-icon{width:28px;height:28px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--ink-dim);font-size:13px;}
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:13.5px;font-weight:500;color:var(--ink);overflow-wrap:anywhere;word-break:break-word;}
  .row-name.done{color:var(--ink-faint);text-decoration:line-through;}
  .row-meta{font-size:9.5px;color:var(--ink-faint);margin-top:2px;font-variant:small-caps;letter-spacing:0.02em;}

  .streak-pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--ink-dim);border:1px solid var(--border);padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .streak-pill.risk{color:var(--alert);border-color:rgba(217,122,140,0.4);}
  .streak-pill.done{color:var(--accent);border-color:rgba(234,184,192,0.4);}

  .tap-btns{display:flex;gap:5px;flex-shrink:0;}
  .tap-btn{width:27px;height:27px;border-radius:3px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);font-size:15px;font-weight:600;background:var(--gc-panel-bg);cursor:pointer;color:var(--ink-dim);}
  .tap-btn.plus{color:var(--ok);}
  .tap-btn.minus{color:var(--alert);}
  .tap-btn.check{color:var(--ok);border-color:rgba(143,201,163,0.4);}
  .tap-btn.check.on{background:var(--ok);color:#150e14;}
  .tap-btn.minus.on{background:var(--alert);color:#150e14;}
  .tap-btn.plus.on{background:var(--ok);color:#150e14;}
  .tap-btn:active{transform:scale(0.92);}

  .checklist-mini{padding-left:38px;margin-top:-2px;padding-bottom:8px;}
  .checklist-item{overflow-wrap:anywhere;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-dim);padding:3px 0;cursor:pointer;}
  .checklist-item .box{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--ink-faintest);flex-shrink:0;}
  .checklist-item.done{color:var(--ink-faint);text-decoration:line-through;}
  .checklist-item.done .box{background:var(--ink);border-color:var(--ink);}

  .todo-check{width:18px;height:18px;border-radius:2px;flex-shrink:0;border:1.5px solid var(--ink-faintest);cursor:pointer;position:relative;}
  .todo-check.done{background:var(--ink);border-color:var(--ink);}
  .todo-check.done::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #150e14;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .todo-p{font-size:8px;font-weight:700;text-transform:uppercase;font-variant:small-caps;letter-spacing:0.03em;padding:2px 7px;border-radius:3px;flex-shrink:0;border:1px solid var(--border);}
  .todo-p.high{color:var(--alert);border-color:rgba(217,122,140,0.35);}
  .todo-p.med{color:var(--warn);border-color:rgba(217,184,114,0.35);}
  .todo-p.low{color:var(--ink-faint);}
  .todo-due{font-size:9.5px;color:var(--ink-faint);flex-shrink:0;font-variant:small-caps;}
  .todo-due.overdue{color:var(--alert);font-weight:700;}

  .empty{font-size:11px;color:var(--ink-faint);padding:8px 4px;font-style:italic;}

  /* S64: hairline delete (archive) button — restrained, not a red delete-everywhere pattern */
  .row-del{width:24px;height:24px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--ink-faintest);cursor:pointer;font-size:12px;line-height:1;}
  .row-del:hover{color:var(--alert);border-color:rgba(217,122,140,0.4);}
  .pickrow{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-dim);flex-wrap:wrap;}
  .pickrow label{display:flex;gap:2px;align-items:center;}
  .habit-row.off-day{display:none;} .show-off .habit-row.off-day{display:grid;opacity:0.55;}
  .bonus{color:var(--ok);font-weight:700;}
  .slip{color:var(--alert);font-weight:700;}
  .logdate-edit{margin-left:8px;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:4px;color:var(--ink);font-size:10px;padding:2px 4px;font-family:inherit;}
  .chk-line{display:flex;align-items:center;gap:6px;}
  .chk-line .checklist-item{flex:1;min-width:0;}
  .opt-tag{font-size:8.5px;color:var(--ink-faintest);font-variant:small-caps;letter-spacing:0.04em;margin-left:4px;}
  .logdate-btn{display:inline-block;margin-top:5px;font-size:10px;font-variant:small-caps;letter-spacing:0.04em;color:var(--ink-dim);border:1px solid var(--border);border-radius:12px;padding:2px 9px;cursor:pointer;}
  .logdate-btn.on{color:#150e14;background:var(--accent);border-color:var(--accent);}
  .item-opt{font-size:9px;line-height:1;color:var(--ink-faintest);cursor:pointer;padding:2px 4px;flex-shrink:0;} .item-opt:hover{color:var(--ink);}
  .item-edit,.item-del{font-size:10px;line-height:1;color:var(--ink-faintest);cursor:pointer;padding:2px 4px;border-radius:3px;flex-shrink:0;}
  .item-edit:hover{color:var(--ink);} .item-del:hover{color:var(--alert);}
  .row-edit{width:24px;height:24px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--ink-faintest);cursor:pointer;font-size:12px;line-height:1;}
  .row-edit:hover{color:var(--ink);border-color:rgba(255,255,255,0.25);}
  /* S64: add-item control for checklist habits */
  .chk-add{display:inline-block;font-size:10px;color:var(--ink-faint);cursor:pointer;padding:4px 0 2px 0;font-variant:small-caps;letter-spacing:0.04em;}
  .chk-add:hover{color:var(--ink-dim);}

  /* create forms */
  .create-form{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px 4px;border-top:1px dashed var(--border);margin-top:8px;}
  .create-form.open{display:flex;}
  .create-form input, .create-form select{
    background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:4px;color:var(--ink);
    font-size:12px;padding:6px 8px;font-family:inherit;
  }
  .create-form input[type="text"]{flex:1;min-width:150px;}
  .create-form .go{font-family:var(--gc-serif);font-variant:small-caps;letter-spacing:0.05em;background:var(--ink);color:#150e14;border:none;border-radius:4px;padding:6px 12px;cursor:pointer;}

  .streak-summary{display:flex;gap:10px;margin-top:4px;}
  .streak-stat{flex:1;text-align:center;padding:11px 4px;border:1px solid var(--border-2);border-radius:4px;}
  .streak-stat-val{font-size:15px;font-weight:700;color:var(--warn);}
  .streak-stat-label{font-size:8.5px;color:var(--ink-faint);text-transform:uppercase;font-variant:small-caps;letter-spacing:0.03em;margin-top:3px;}
  .stub-note{font-size:9px;color:var(--ink-faintest);text-align:center;font-style:italic;margin-top:2px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="backlink panel" href="/">← Command Center</a>
  <div class="brand"><span class="brand-mark"></span><span class="brand-text"><b>GHOST</b><span>HABITS &amp; TODOS</span></span></div>
  <div class="spacer"></div>
  <div class="nav-pill panel" data-role="nav-item">
    <button id="tabHabits" class="active" onclick="showView('habits')">Habits &amp; Todos</button>
  </div>
</div>

<div class="wrap">

  <!-- ===== Habits & Todos view ===== -->
  <div id="habitsView">

    <div class="panel section">
      <div class="section-head">
        <div class="card-title">Today's Habits</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="section-sub" id="habitsSub"></span>
          <button class="add-btn" onclick="toggleForm('habitForm')">+ New habit</button>
        </div>
      </div>
      <div id="habitsList" data-role="habits-list"><div class="empty">Loading…</div></div>
      <div class="create-form" id="habitForm">
        <input type="text" id="hName" placeholder="Habit name">
        <select id="hField">
          <option value="tickbox">tickbox</option>
          <option value="positive">positive</option>
          <option value="negative">negative</option>
          <option value="both">positive + negative</option>
          <option value="checklist">checklist</option>
          <option value="value">value (hours, reps…)</option>
        </select>
        <select id="hFreq" onchange="syncHabitForm()">
          <option value="weekdays">every day</option>
          <option value="days">specific days</option>
          <option value="count">N×/week</option>
          <option value="monthly">monthly</option>
        </select>
        <span id="hDays" class="pickrow" style="display:none;">
          <label><input type="checkbox" value="0">Mon</label><label><input type="checkbox" value="1">Tue</label><label><input type="checkbox" value="2">Wed</label><label><input type="checkbox" value="3">Thu</label><label><input type="checkbox" value="4">Fri</label><label><input type="checkbox" value="5">Sat</label><label><input type="checkbox" value="6">Sun</label>
        </span>
        <span id="hCount" class="pickrow" style="display:none;">times <input type="number" id="hCountMin" min="1" max="31" placeholder="min" style="width:56px"> to <input type="number" id="hCountMax" min="1" max="31" placeholder="max (opt.)" style="width:84px"></span>
        <span id="hTarget" class="pickrow" style="display:none;">target <input type="number" id="hTargetMin" min="0" step="any" placeholder="min" style="width:60px"> to <input type="number" id="hTargetMax" min="0" step="any" placeholder="max (opt.)" style="width:84px"> <input type="text" id="hUnit" placeholder="unit (hrs)" style="width:80px;flex:none;min-width:0"></span>
        <input type="text" id="hItems" placeholder="checklist items, comma-separated; end an item with ? to make it optional">
        <span class="pickrow"><label><input type="checkbox" id="hLogOn" onchange="syncHabitForm()">second tick</label><input type="text" id="hLogLabel" placeholder="label" value="Log date" style="width:90px;flex:none;min-width:0;display:none"></span>
        <button class="go" id="hGo" onclick="createHabit()">Add</button>
      </div>
    </div>

    <div class="panel section">
      <div class="section-head">
        <div class="card-title">Todos</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="section-sub" id="todosSub"></span>
          <button class="add-btn" onclick="toggleForm('todoForm')">+ New todo</button>
        </div>
      </div>
      <div id="todosList" data-role="todos-list"><div class="empty">Loading…</div></div>
      <div class="create-form" id="todoForm">
        <input type="text" id="tText" placeholder="Todo text">
        <select id="tPriority"><option value="med">Med</option><option value="high">High</option><option value="low">Low</option></select>
        <input type="date" id="tDue">
        <button class="go" id="tGo" onclick="createTodo()">Add</button>
      </div>
    </div>

  </div>

</div>

<script>
(function(){
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function post(url, body){ return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}); }

  window.showView = function(v){
    document.getElementById("habitsView").style.display = (v==="habits")?"block":"none";
    document.getElementById("tabHabits").classList.toggle("active", v==="habits");
  };
  window.toggleForm = function(id){
    // opening or closing a form always leaves "edit" mode, so a half-finished edit can't turn the next Add into a save
    if(id==="habitForm") resetHabitForm();
    if(id==="todoForm"){ editingTodo=null; document.getElementById("tGo").textContent="Add"; document.getElementById("tText").value=""; document.getElementById("tDue").value=""; }
    document.getElementById(id).classList.toggle("open");
  };

  // ---- Habits ----
  function fmt(n){ return (Math.round(Number(n)*100)/100).toString(); }
  function progressText(h){
    var p = h.period;
    if(p){
      var tgt = p.target==null ? "" : (" of " + fmt(p.target) + (p.max && p.max!==p.target ? "–"+fmt(p.max) : ""));
      var u = h.unit ? " "+esc(h.unit) : "";
      return ' · <span class="'+(p.bonus?"bonus":"")+'">'+fmt(p.done)+tgt+u+' this '+p.kind+(p.bonus?" · bonus":"")+(p.met&&!p.bonus?" ✓":"")+'</span>';
    }
    if(h.field_type==="negative") return h.today_down>0 ? ' · <span class="slip">'+h.today_down+' slip'+(h.today_down>1?"s":"")+' today</span>' : ' · clean so far today';
    if(h.field_type==="positive") return h.today_up>0 ? ' · '+h.today_up+' today' : "";
    if(h.field_type==="both") return (h.today_up||h.today_down) ? ' · +'+h.today_up+' / −'+h.today_down+' today' : "";
    if(h.field_type==="value") return ' · '+fmt(h.today_value)+(h.unit?" "+esc(h.unit):"")+' today';
    if(h.field_type==="checklist"){
      var cl=h.checklist||[]; if(!cl.length) return "";
      var req=cl.filter(function(c){return !c.optional;}), od=cl.filter(function(c){return c.optional&&c.done;}).length;
      return ' · '+req.filter(function(c){return c.done;}).length+' of '+req.length+(od?' (+'+od+' optional)':"");
    }
    return "";
  }
  window.tapValue = function(id, unit){
    var raw = prompt("How much" + (unit ? " ("+unit+")" : "") + "?"); if(raw===null) return;
    var v = Number(raw); if(!(v>0)) return;
    fetch("/api/habits/tap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,direction:"up",value:v})}).then(function(){ loadHabits(); });
  };
  window.editLogDate = function(id, el){
    post("/api/habits/log-date/edit",{id:id,old_date:el.getAttribute("data-old")||"",new_date:el.value||""}).then(function(){ loadHabits(); });
  };
  window.logDate = function(id, on){ post("/api/habits/log-date",{id:id,on:on}).then(function(){ loadHabits(); }); };
  window.toggleOptional = function(id, opt){ post("/api/habits/checklist/optional",{id:id,optional:opt}).then(function(){ loadHabits(); }); };
  window.toggleOffDays = function(){ document.getElementById("habitsList").classList.toggle("show-off"); loadHabits(); };
  function habitRow(h){
    var streakCls = (h.period ? h.period.met : h.done_today) ? "done" : ((h.due_today && h.streak>0) ? "risk" : "");
    var meta = esc(h.frequency_label) + " · " + esc(h.field_label) + progressText(h);
    var taps = "";
    if(h.field_type==="tickbox"){
      taps = '<div class="tap-btns"><div class="tap-btn check '+(h.done_today?"on":"")+'" title="'+(h.done_today?"un-tick":"tick")+'" onclick="tap('+h.id+',\''+(h.done_today?"uncheck":"check")+'\')">✓</div></div>';
    } else if(h.field_type==="value"){
      taps = '<div class="tap-btns"><div class="tap-btn plus" title="log '+esc(h.unit||"value")+'" onclick="tapValue('+h.id+',\''+esc(h.unit||"")+'\')">+</div></div>';
    } else if(h.field_type==="checklist"){
      taps = '<div class="tap-btns"></div>';   // S77: empty cell keeps the 5-track grid aligned
    } else if(h.field_type==="positive"){
      taps = '<div class="tap-btns"><div class="tap-btn plus '+(h.today_up>0?"on":"")+'" onclick="tap('+h.id+',\'up\')">+</div></div>';
    } else if(h.field_type==="negative"){
      taps = '<div class="tap-btns"><div class="tap-btn minus '+(h.today_down>0?"on":"")+'" title="log a slip" onclick="tap('+h.id+',\'down\')">−</div></div>';
    } else { // both
      taps = '<div class="tap-btns"><div class="tap-btn minus '+(h.today_down>0?"on":"")+'" onclick="tap('+h.id+',\'down\')">−</div><div class="tap-btn plus '+(h.today_up>0?"on":"")+'" onclick="tap('+h.id+',\'up\')">+</div></div>';
    }
    var del = '<div class="row-del" title="Archive this habit" onclick="delHabit('+h.id+',\''+esc(h.name).replace(/'/g,"\\'")+'\')">✕</div>';
    // S77: grid column order — icon | name | tap-controls | streak pill | archive. taps now
    // precedes the streak pill so the pill sits in its own fixed track (a straight column).
    window.__habits = window.__habits || {}; window.__habits[h.id] = h;
    var edit = '<div class="row-edit" title="Edit" onclick="editHabit('+h.id+')">✎</div>';
    var row = '<div class="habit-row'+(h.due_today?'':' off-day')+'">'
      + '<div class="row-icon">◈</div>'
      + '<div class="row-main"><div class="row-name">'+esc(h.name)+'</div><div class="row-meta">'+meta+(h.streak_rule==="min_taps"?(" · needs "+h.streak_min_taps+" taps"):"")+'</div>'
        + (h.log_date_label ? '<div><span class="logdate-btn '+(h.logged_today?"on":"")+'" title="records today\'s date; a normal tick does not" onclick="logDate('+h.id+','+(!h.logged_today)+')">'+esc(h.log_date_label)+(h.logged_today?" ✓":"")+'</span>'+'<span class="row-meta" style="margin-left:8px">last:</span><input type="date" class="logdate-edit" title="change or clear the saved date" value="'+esc(h.last_logged||"")+'" data-old="'+esc(h.last_logged||"")+'" onchange="editLogDate('+h.id+',this)"></div>' : "")
        + '</div>'
      + taps
      + '<div class="streak-pill '+streakCls+'">🔥 '+h.streak+'</div>'
      + edit + del
      + '</div>';
    if(h.field_type==="checklist"){
      // S64: render the checklist area for EVERY checklist habit (even with 0 items) so the
      // "+ add item" control is always available — Session 62's create form collected no items,
      // so checklist habits had nothing to tick and no way to add.
      row += '<div class="checklist-mini">';
      (h.checklist||[]).forEach(function(c){
        row += '<div class="chk-line"><div class="checklist-item '+(c.done?"done":"")+(c.optional?" optional":"")+'" onclick="checkHabitItem('+c.id+','+(!c.done)+')"><span class="box"></span>'+esc(c.text)+(c.optional?' <span class="opt-tag">optional</span>':"")+'</div>'
          + '<span class="item-opt" title="'+(c.optional?"Make required":"Make optional")+'" onclick="toggleOptional('+c.id+','+(!c.optional)+')">'+(c.optional?"●":"○")+'</span><span class="item-edit" title="Rename item" onclick="renameItem(\'habit\','+c.id+')">✎</span><span class="item-del" title="Remove item" onclick="delItem(\'habit\','+c.id+')">✕</span></div>';
      });
      row += '<span class="chk-add" onclick="addChecklistItem('+h.id+')">+ add item</span>';
      row += '</div>';
    }
    return row;
  }
  function loadHabits(){
    fetch("/api/habits").then(function(r){return r.json();}).then(function(d){
      var list = d.habits||[];
      var el = document.getElementById("habitsList");
      if(!list.length){ el.innerHTML = '<div class="empty">No native habits yet — add one, or tell Ghost "create habit: ...".</div>'; document.getElementById("habitsSub").textContent=""; return; }
      var due = list.filter(function(h){return h.due_today;});
      var touched = due.filter(function(h){return h.done_today||h.today_up||h.today_check||h.ticked_today;}).length;
      var off = list.length - due.length;
      var showing = el.classList.contains("show-off");
      document.getElementById("habitsSub").innerHTML = touched + " of " + due.length + " touched today"
        + (off ? ' · <a href="#" id="offToggle" onclick="toggleOffDays();return false;" style="text-decoration:underline">'+(showing?"hide":"show")+' '+off+' off-day</a>' : "");
      el.innerHTML = list.map(habitRow).join("");
    }).catch(function(){ document.getElementById("habitsList").innerHTML='<div class="empty">Could not load habits.</div>'; });
  }
  window.tap = function(id, dir){ post("/api/habits/tap",{id:id,direction:dir}).then(function(){ loadHabits(); }); };
  window.checkHabitItem = function(id, done){ post("/api/habits/checklist",{id:id,done:done}).then(function(){ loadHabits(); }); };
  window.addChecklistItem = function(habitId){
    var text = prompt("New checklist item (end with ? to make it optional):"); if(!text || !text.trim()) return;
    post("/api/habits/checklist/add",{id:habitId,text:text.trim()}).then(function(){ loadHabits(); });
  };
  window.delHabit = function(id, name){
    if(!confirm('Archive habit "'+name+'"? It stops showing here; its history is kept.')) return;
    post("/api/habits/delete",{id:id}).then(function(){ loadHabits(); });
  };
  var editingHabit = null;
  window.syncHabitForm = function(){
    var f=document.getElementById("hFreq").value, t=document.getElementById("hField").value;
    document.getElementById("hDays").style.display = (f==="days")?"flex":"none";
    document.getElementById("hCount").style.display = (f==="count"||f==="monthly")?"flex":"none";
    document.getElementById("hTarget").style.display = (t==="value")?"flex":"none";
    document.getElementById("hLogLabel").style.display = document.getElementById("hLogOn").checked ? "" : "none";
  };
  document.getElementById("hField").addEventListener("change", function(){ window.syncHabitForm(); });
  function dayBoxes(){ return Array.prototype.slice.call(document.querySelectorAll("#hDays input")); }
  function habitBody(){
    var f=document.getElementById("hFreq").value, t=document.getElementById("hField").value, b={field_type:t};
    var num=function(id){ var v=document.getElementById(id).value; return v===""?null:Number(v); };
    if(f==="days"){
      b.frequency_kind="weekdays";
      b.frequency_days=dayBoxes().filter(function(x){return x.checked;}).map(function(x){return Number(x.value);});
      if(!b.frequency_days.length) b.frequency_days=[0,1,2,3,4,5,6];
    } else if(f==="weekdays"){ b.frequency_kind="weekdays"; b.frequency_days=[0,1,2,3,4,5,6]; }
    else { b.frequency_kind=f; b.frequency_count=num("hCountMin")||(f==="monthly"?1:3); b.frequency_count_max=num("hCountMax"); }
    b.log_date_label = document.getElementById("hLogOn").checked ? (document.getElementById("hLogLabel").value.trim()||"Log date") : "";
    if(t==="value"){ b.target_value=num("hTargetMin"); b.target_max=num("hTargetMax"); b.unit=document.getElementById("hUnit").value.trim(); }
    return b;
  }
  window.editHabit = function(id){
    var h = window.__habits[id]; if(!h) return;
    editingHabit = id;
    document.getElementById("habitForm").classList.add("open");
    document.getElementById("hName").value = h.name;
    document.getElementById("hField").value = h.field_type;
    var f = h.frequency_kind==="weekdays" ? ((h.frequency_days||[]).length===7 ? "weekdays" : "days") : h.frequency_kind;
    document.getElementById("hFreq").value = f;
    dayBoxes().forEach(function(x){ x.checked = (h.frequency_days||[]).indexOf(Number(x.value))>=0; });
    document.getElementById("hCountMin").value = h.frequency_count||""; document.getElementById("hCountMax").value = h.frequency_count_max||"";
    document.getElementById("hTargetMin").value = h.target_value||""; document.getElementById("hTargetMax").value = h.target_max||""; document.getElementById("hUnit").value = h.unit||"";
    document.getElementById("hItems").style.display = "none";
    document.getElementById("hLogOn").checked = !!h.log_date_label; document.getElementById("hLogLabel").value = h.log_date_label || "Log date";
    document.getElementById("hGo").textContent = "Save";
    window.syncHabitForm();
    document.getElementById("hName").focus();
  };
  function resetHabitForm(){
    editingHabit = null;
    ["hName","hItems","hCountMin","hCountMax","hTargetMin","hTargetMax","hUnit"].forEach(function(i){ document.getElementById(i).value=""; });
    dayBoxes().forEach(function(x){ x.checked=false; });
    document.getElementById("hLogOn").checked = false; document.getElementById("hLogLabel").value = "Log date";
    document.getElementById("hItems").style.display = "";
    document.getElementById("hGo").textContent = "Add";
    window.syncHabitForm();
  }
  window.createHabit = function(){
    var name=document.getElementById("hName").value.trim(); if(!name) return;
    var body=habitBody(); body.name=name;
    if(editingHabit !== null){
      body.id=editingHabit;
      post("/api/habits/edit",body).then(function(){ resetHabitForm(); document.getElementById("habitForm").classList.remove("open"); loadHabits(); });
      return;
    }
    // S64: collect checklist items at create time (comma-separated) — only meaningful for a checklist habit
    if(body.field_type==="checklist"){
      var raw=(document.getElementById("hItems").value||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
      if(raw.length) body.checklist=raw;
    }
    post("/api/habits/create",body).then(function(){ resetHabitForm(); toggleForm("habitForm"); loadHabits(); });
  };

  // ---- Todos ----
  function todoRow(t){
    var due = "";
    if(t.due_date){
      var lbl = "Due " + t.due_date.slice(5);
      due = '<div class="todo-due '+(t.overdue?"overdue":"")+'">'+esc(lbl)+'</div>';
    }
    var cl = t.checklist || [];
    var meta = (t.kind==="checklist")
      ? ('<div class="row-meta">checklist · '+cl.filter(function(c){return c.done;}).length+' of '+cl.length+'</div>')
      : "";
    var del = '<div class="row-del" title="Archive this todo" onclick="delTodo('+t.id+',\''+esc(t.text).replace(/'/g,"\\'")+'\')">✕</div>';
    window.__todos = window.__todos || {}; window.__todos[t.id] = t;
    var edit = '<div class="row-edit" title="Edit" onclick="editTodo('+t.id+')">✎</div>';
    var row = '<div class="todo-row">'
      + '<div class="todo-check '+(t.done?"done":"")+'" onclick="completeTodo('+t.id+','+(!t.done)+')"></div>'
      + '<div class="row-main"><div class="row-name '+(t.done?"done":"")+'">'+esc(t.text)+'</div>'+meta+'</div>'
      + (t.priority?'<div class="todo-p '+t.priority+'">'+t.priority.charAt(0).toUpperCase()+t.priority.slice(1)+'</div>':"")
      + due + edit + del + '</div>';
    // S77: mirror the S64 habit-checklist UI onto checklist todos — render the mini-list for EVERY
    // checklist todo (even 0-item) so the "+ add item" control is always reachable; tick wires to
    // the existing /api/todos/checklist endpoint (all-ticked completes the todo).
    if(t.kind==="checklist"){
      row += '<div class="checklist-mini">';
      cl.forEach(function(c){
        row += '<div class="chk-line"><div class="checklist-item '+(c.done?"done":"")+'" onclick="checkTodoItem('+c.id+','+(!c.done)+')"><span class="box"></span>'+esc(c.text)+'</div>'
          + '<span class="item-edit" title="Rename item" onclick="renameItem(\'todo\','+c.id+')">✎</span><span class="item-del" title="Remove item" onclick="delItem(\'todo\','+c.id+')">✕</span></div>';
      });
      row += '<span class="chk-add" onclick="addTodoChecklistItem('+t.id+')">+ add item</span>';
      row += '</div>';
    }
    return row;
  }
  window.renameItem = function(kind, id){
    var text = prompt("Rename item:"); if(!text || !text.trim()) return;
    post("/api/"+(kind==="habit"?"habits":"todos")+"/checklist/rename",{id:id,text:text.trim()}).then(function(){ kind==="habit"?loadHabits():loadTodos(); });
  };
  window.delItem = function(kind, id){
    if(!confirm("Remove this checklist item?")) return;
    post("/api/"+(kind==="habit"?"habits":"todos")+"/checklist/delete",{id:id}).then(function(){ kind==="habit"?loadHabits():loadTodos(); });
  };
  window.checkTodoItem = function(id, done){ post("/api/todos/checklist",{id:id,done:done}).then(function(){ loadTodos(); }); };
  window.addTodoChecklistItem = function(todoId){
    var text = prompt("New checklist item:"); if(!text || !text.trim()) return;
    post("/api/todos/checklist/add",{id:todoId,text:text.trim()}).then(function(){ loadTodos(); });
  };
  function loadTodos(){
    fetch("/api/todos").then(function(r){return r.json();}).then(function(d){
      var list = d.todos||[];
      var el = document.getElementById("todosList");
      if(!list.length){ el.innerHTML = '<div class="empty">No todos yet — add one, or tell Ghost "add todo: ...".</div>'; document.getElementById("todosSub").textContent=""; return; }
      var overdue = list.filter(function(t){return t.overdue;}).length;
      document.getElementById("todosSub").textContent = overdue ? (overdue+" overdue") : (list.filter(function(t){return !t.done;}).length+" open");
      el.innerHTML = list.map(todoRow).join("");
    }).catch(function(){ document.getElementById("todosList").innerHTML='<div class="empty">Could not load todos.</div>'; });
  }
  window.completeTodo = function(id, done){ post("/api/todos/complete",{id:id,done:done}).then(function(){ loadTodos(); }); };
  window.delTodo = function(id, text){
    if(!confirm('Archive todo "'+text+'"? It stops showing here; its record is kept.')) return;
    post("/api/todos/delete",{id:id}).then(function(){ loadTodos(); });
  };
  var editingTodo = null;
  window.editTodo = function(id){
    var t = window.__todos[id]; if(!t) return;
    editingTodo = id;
    document.getElementById("todoForm").classList.add("open");
    document.getElementById("tText").value = t.text;
    document.getElementById("tPriority").value = t.priority || "med";
    document.getElementById("tDue").value = t.due_date || "";
    document.getElementById("tGo").textContent = "Save";
    document.getElementById("tText").focus();
  };
  window.createTodo = function(){
    var text=document.getElementById("tText").value.trim(); if(!text) return;
    if(editingTodo !== null){
      var eb={id:editingTodo,text:text,priority:document.getElementById("tPriority").value,due_date:document.getElementById("tDue").value||""};
      post("/api/todos/edit",eb).then(function(){ editingTodo=null; document.getElementById("tText").value=""; document.getElementById("tDue").value=""; document.getElementById("tGo").textContent="Add"; document.getElementById("todoForm").classList.remove("open"); loadTodos(); });
      return;
    }
    var body={text:text,priority:document.getElementById("tPriority").value};
    var due=document.getElementById("tDue").value; if(due) body.due_date=due;
    post("/api/todos/create",body).then(function(){ document.getElementById("tText").value=""; document.getElementById("tDue").value=""; toggleForm("todoForm"); loadTodos(); });
  };


  loadHabits(); loadTodos();
})();
</script>

<!-- S83: register the PWA service worker (shell caching for instant home-screen launch). Scoped
     to the whole origin because /sw.js is served from root; failure is non-fatal (page still works). -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (e) {
        console.warn("Ghost SW registration failed:", e);
      });
    });
  }
</script>
</body>
